# Packaging for the second of the two ways this tool reaches a user
# (dev/ARCHITECTURE.md section 9.1):
#
#   Route A, a shared computer: the physdemo suite LINKS
#     src/scripts/scsim.py and supplies the environment. Nothing in
#     this file is used, and the tool is never pip-installed there.
#   Route B, a personal computer: `pip install` of this repository.
#     pip reads this file, installs the dependencies below, and creates
#     the `scsim` command on Windows, macOS, and Linux alike.
#
# The dependencies are therefore DECLARED here, because on Route B
# nobody else will supply them. The physdemo suite's requirements.in is
# the single statement of what the course tools need: the lower bounds
# below repeat the subset this package imports and must be no tighter
# than the suite's. To install against a pinned, tested set instead,
# `pip install -r <physdemo>/requirements.txt` and then this package
# with `--no-deps`.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scattering"
# The version is read from scattering/__init__.py (__version__), the one
# place it is stated; see [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "Teaching tool for classical scattering and its inversion"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "vedo>=2025.5",
    "vtk>=9.4",
    "pint>=0.24",
    "tomli>=2.0; python_version < '3.11'",
    "tomli_w>=1.0",
]

[project.optional-dependencies]
batch = ["h5py>=3.10"]          # Tier 2 HDF5 output (design 13; later)
test = ["pytest>=8.0"]

# The front door on Route B. The command's body is a module inside the
# package (dev/ARCHITECTURE.md section 4.13), so that this console
# script and the executable src/scripts/scsim.py run the same code.
[project.scripts]
scsim = "scattering.cli.scsim:console_main"

[project.urls]
Repository = "https://github.com/UMKC-CPG/scattering"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "scattering.__version__"}

# The example run files are data inside the package, so that they are
# installed with it and `scsim --examples` can find them anywhere.
[tool.setuptools.package-data]
"scattering.examples" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
