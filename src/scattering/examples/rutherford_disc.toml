# rutherford_disc.toml -- a uniform-flux beam for the detector and
# the inversion. Same physics as rutherford.toml; different beam.

schema = 1                      # run-file schema version (design 10.4)

[potential]
kind   = "coulomb"
preset = "alpha_on_gold"

[beam]
energies    = ["5 MeV"]
layout      = "disc"
# 400 starts in seconds and shows the detector's idea (with the shipped
# 40 log-theta bins about a third of them are empty, which is itself a
# lesson in counting statistics). The histogram of design 7, with no
# empty bins and a pull rms near 1, needs 20000 or more; that is a
# batch-tier size (design 13) and takes minutes to draw interactively,
# because each frame redraws every particle.
n_particles = 400
b_min       = 0.0
b_max       = 12.0
seed        = 20260910          # REQUIRED for "disc": a run that depends
                                # on chance records the chance (A7)

[detector]
radius = 2.0
mode   = "asymptotic"
layout = "log_theta"
n_bins = 40

[inversion]
assume_sign = +1                # the counts carry no sign (design 7.7);
                                # this is the student's assumption
tail_model  = "coulomb"         # beyond the last measured b (design 8)

[fidelity]
integrator = "dop853"
r_max      = 40.0
n_samples  = 200

[view]
palette = "light"
